<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BiznessHunter — Opportunités business</title>
<style>
body{font-family:Arial,sans-serif;max-width:1100px;margin:40px auto;padding:0 20px;background:#f6f7f9;color:#171717}
h1{font-size:38px;margin-bottom:5px}
.subtitle{color:#666;margin-bottom:35px}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin:20px 0 30px}
.stat{background:white;border:1px solid #ddd;border-radius:12px;padding:16px 22px}
.stat b{font-size:26px;display:block}
.card{background:white;border:1px solid #ddd;border-radius:14px;padding:24px;margin:16px 0;box-shadow:0 2px 8px #00000008}
.top{display:flex;justify-content:space-between;gap:20px}
.score{font-size:30px;font-weight:bold}
.badge{display:inline-block;padding:6px 10px;border-radius:20px;background:#eee;font-size:13px}
.meta{display:flex;gap:20px;flex-wrap:wrap;margin-top:18px;color:#555}
.why{margin-top:20px}
.launch{margin-top:16px;padding:14px;background:#f6f7f9;border-radius:10px}
.loading{text-align:center;padding:60px}
</style>
</head>
<body>

<h1>BiznessHunter</h1>
<div class="subtitle">
Des modèles business validés ailleurs, transformés en opportunités de copycat.
</div>

<div id="app" class="loading">Chargement des opportunités…</div>

<script>
fetch("radar17_opportunities.json")
.then(r=>{
    if(!r.ok) throw new Error("Fichier introuvable");
    return r.json();
})
.then(data=>{

    const items = Array.isArray(data)
        ? data
        : data.opportunities || data.results || [];

    items.sort((a,b)=>
        Number(b.gap_score||0)-Number(a.gap_score||0)
    );

    const strong = items.filter(x =>
        String(x.verdict||"").includes("HIGH")
    ).length;

    const signals = items.reduce((sum,x)=>
        sum + Number(x.company_count||0),0);

    document.getElementById("app").innerHTML = `

        <div class="stats">
            <div class="stat">
                <b>${items.length}</b>
                Opportunités détectées
            </div>

            <div class="stat">
                <b>${strong}</b>
                Opportunités fortes
            </div>

            <div class="stat">
                <b>${signals}</b>
                Signaux entreprises
            </div>
        </div>

        ${items.map((x,i)=>`

        <div class="card">

            <div class="top">

                <div>
                    <h2>${esc(x.opportunity || "Opportunité")}</h2>

                    <span class="badge">
                        ${esc(x.verdict || "WATCH")}
                    </span>
                </div>

                <div class="score">
                    ${Number(x.gap_score||0)}/100
                </div>

            </div>

            <div class="meta">

                <span>
                    Entreprises détectées
                    <b>${Number(x.company_count||0)}</b>
                </span>

                <span>
                    Articles
                    <b>${Number(x.article_count||0)}</b>
                </span>

                <span>
                    Réplication
                    <b>${Number(x.replication||0)}/100</b>
                </span>

                <span>
                    Gap concurrence
                    <b>${Number(x.competition_gap||0)}/100</b>
                </span>

                <span>
                    Gap géographique
                    <b>${Number(x.geographic_gap||0)}/100</b>
                </span>

            </div>

        </div>

        `).join("")}

    `;
})
.catch(e=>{
    document.getElementById("app").innerHTML =
    "<div class='card'>Impossible de charger radar17_opportunities.json.<br><br>"+
    esc(e.message)+"</div>";
});

function esc(v){
    return String(v)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;");
}
</script>

</body>
</html>
